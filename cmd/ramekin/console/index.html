<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="ramekin-console-key" content="{{.Key}}">
<title>{{.Project}} · Ramekin dashboard</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="top">
  <div>
    <h1>{{.Project}}</h1>
    <p class="sub">Ramekin fleet dashboard · <span id="updated">connecting…</span></p>
  </div>
  <div class="summary" id="summary" aria-label="Fleet health"></div>
  <button class="theme" id="theme" type="button" aria-pressed="false">Light theme</button>
</header>
<main>
  <p class="banner" id="banner" hidden></p>
  <div class="grid" id="devices"></div>
  <div class="empty" id="empty" hidden>
    <h2>No devices yet</h2>
    <p>The console shows the devices in this project's <code>.ramekin/devices</code>. Create one with <code>ramekin device init &lt;name&gt;</code>.</p>
  </div>
</main>
<section class="logs" id="logs" hidden aria-labelledby="logs-title">
  <div class="logs-head">
    <h2 id="logs-title">Logs</h2>
    <span class="logs-state" id="logs-state" role="status"></span>
    <div class="logs-actions">
      <button type="button" id="logs-reconnect" hidden>Reconnect</button>
      <button type="button" id="logs-clear">Clear</button>
      <button type="button" id="logs-close">Close</button>
    </div>
  </div>
  <div class="logs-body" id="logs-body" role="log" aria-live="off" tabindex="0"></div>
</section>
</body>
</html>
