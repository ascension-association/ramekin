name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Native runtime test (root)
        run: |
          sudo apt-get update && sudo apt-get install -y squashfs-tools
          sudo -E env "PATH=$PATH" go test -run "TestRunSIF|TestExec" -v ./internal/container
      - name: Cross-compile the device agent
        run: |
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build ./cmd/ramekind
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build ./cmd/ramekind
